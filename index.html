<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계시간 · Meridian</title>
<meta name="description" content="기준 도시의 시각을 중심으로 여러 도시의 지금을 나란히 봅니다.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#010102">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meridian.css">
</head>
<body>
<div id="chrome"></div>

<main id="main">
  <div class="wrap">
    <h1 class="sr-only">세계시간</h1>
    <div class="hero">
     <div class="clockbar">

      <section aria-labelledby="refHeading">
        <p class="ref-city" id="refHeading">
          <span id="refName">서울</span> · <span id="refCountry">대한민국</span>
        </p>
        <p class="clock" id="clock" role="timer" aria-live="off">
          <span id="clockHM">--:--</span><span class="sec" id="clockS">--</span>
        </p>
        <div class="hero-meta">
          <span class="date" id="refDate">&nbsp;</span>
          <span class="badge" id="refWeather" aria-live="polite" hidden></span>
        </div>
      </section>

      <section class="shift" aria-labelledby="shiftLabel">
          <div class="shift-head">
            <h2 id="shiftLabel">시간 옮겨 보기</h2>
            <button type="button" class="shift-reset" id="shiftReset" disabled>지금으로 되돌리기</button>
          </div>
          <output class="shift-val" id="shiftVal" for="shiftRange">지금</output>
          <div class="slider">
            <input type="range" id="shiftRange" min="-24" max="24" step="0.5" value="0"
                   aria-labelledby="shiftLabel" aria-describedby="shiftVal">
          </div>
          <div class="slider-ticks" aria-hidden="true">
            <span>-24</span><span>-12</span><span>0</span><span>+12</span><span>+24</span>
          </div>
      </section>

     </div>

      <section class="panel" aria-labelledby="railHeading" style="margin-top:var(--sp-lg)">
        <h2 class="t-body-sm" id="railHeading" style="margin-bottom:var(--sp-xs)">도시별 현재 시각</h2>
        <div class="rail" id="rail"></div>

        <form class="add-row" id="addForm">
          <label class="field-label" for="addCity" hidden>도시 이름</label>
          <input class="input" id="addCity" name="city" list="cityList" autocomplete="off" spellcheck="false"
                 placeholder="도시 이름을 입력하세요" aria-describedby="addHint">
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
        <datalist id="cityList"></datalist>
        <p class="add-hint" id="addHint">이 브라우저에 저장됩니다. 주소를 복사하면 다른 기기로 옮길 수 있습니다.</p>
        <p class="error" id="addError" role="alert" hidden></p>
      </section>

    </div>
  </div>
</main>

<div id="pagefoot"></div>

<script src="meridian.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  document.getElementById('chrome').innerHTML = M.nav('세계시간');
  document.getElementById('pagefoot').innerHTML =
    M.foot('날씨 <a href="https://open-meteo.com/">Open-Meteo</a>');

  $('navActions').innerHTML =
    '<button type="button" class="btn btn-tertiary" id="copyUrl">주소 복사</button>' +
    '<button type="button" class="btn btn-secondary" id="focusAdd">도시 추가</button>';

  /* ---------- 상태 ---------- */
  var params = new URLSearchParams(location.search);
  var fromUrl = params.get('c');
  var cities;
  if (fromUrl) {
    cities = fromUrl.split(',').map(function (s) { return s.trim(); })
                    .filter(function (s) { return M.CITIES[s]; });
    if (cities.length) M.save('cities', cities);
  }
  if (!cities || !cities.length) cities = M.load('cities', M.DEFAULT_CITIES).slice();
  cities = cities.filter(function (c) { return M.CITIES[c]; });
  if (!cities.length) cities = M.DEFAULT_CITIES.slice();

  var shiftHours = 0;

  /* 도시 이름 자동완성 */
  $('cityList').innerHTML = Object.keys(M.CITIES).map(function (n) {
    return '<option value="' + M.escapeHtml(n) + '"></option>';
  }).join('');

  function refCity() { return cities[0]; }
  function shiftedNow() { return new Date(Date.now() + shiftHours * 3600000); }

  /* ---------- 렌더 ---------- */
  function renderRail() {
    var now = shiftedNow();
    var ref = refCity(), refTz = M.CITIES[ref][0];
    var refP = M.tzParts(refTz, now);

    $('rail').innerHTML = cities.map(function (city, idx) {
      var meta = M.CITIES[city], tz = meta[0];
      var p = M.tzParts(tz, now);
      var isRef = idx === 0;
      var delta = M.dayDelta(refP, p);
      var dayLabel = delta === 0 ? '오늘' : delta > 0 ? '내일' : '어제';
      var off = isRef ? '기준' : M.formatOffset(M.offsetMinutes(refTz, tz, now));

      var dl = M.daylight(city, now);
      var band = '';
      for (var h = 0; h < 24; h++) {
        var cls = (h === p.hour) ? 'now' : (dl.hours[h] ? 'day' : '');
        band += '<i class="' + cls + '"></i>';
      }
      var legend = dl.setLabel
        ? '<span>해 뜸 <span class="mono">' + dl.riseLabel + '</span></span>' +
          '<span>해 짐 <span class="mono">' + dl.setLabel + '</span></span>'
        : (dl.riseLabel ? '<span>' + dl.riseLabel + '</span>' : '');

      return '<div class="rail-row' + (isRef ? ' is-ref' : '') + '">' +
        '<div class="rail-head">' +
          '<div>' +
            '<div class="rail-name">' + M.escapeHtml(city) + '</div>' +
            '<div class="rail-off">' + off + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:flex-start;gap:var(--sp-xs)">' +
            '<div>' +
              '<div class="rail-time">' + M.pad2(p.hour) + ':' + M.pad2(p.minute) + '</div>' +
              '<div class="rail-day">' + dayLabel + '</div>' +
            '</div>' +
            (cities.length > 1
              ? '<button type="button" class="rail-remove" data-remove="' + M.escapeHtml(city) +
                '" aria-label="' + M.escapeHtml(city) + ' 삭제">' + M.icon('close', 15) + '</button>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="band" role="img" aria-label="' + M.escapeHtml(city) + ' 낮과 밤">' + band + '</div>' +
        (legend ? '<div class="band-legend">' + legend + '</div>' : '') +
      '</div>';
    }).join('');
  }

  function renderHero() {
    var now = shiftedNow();
    var ref = refCity(), meta = M.CITIES[ref];
    var p = M.tzParts(meta[0], now);
    $('refName').textContent = ref;
    $('refCountry').textContent = meta[3];
    $('clockHM').textContent = M.pad2(p.hour) + ':' + M.pad2(p.minute);
    $('clockS').textContent = M.pad2(p.second);
    $('clock').setAttribute('aria-label',
      ref + ' ' + p.hour + '시 ' + p.minute + '분');
    $('refDate').textContent = M.formatDate(meta[0], now);
  }

  function tick() {
    renderHero();
    renderRail();
  }

  /* ---------- 기준 도시 날씨 ---------- */
  function loadRefWeather() {
    var ref = refCity(), meta = M.CITIES[ref];
    var badge = $('refWeather');
    badge.hidden = false;
    badge.innerHTML = '<span class="skeleton">불러오는 중…</span>';
    M.getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + meta[1] +
      '&longitude=' + meta[2] + '&current=temperature_2m,weather_code&timezone=' +
      encodeURIComponent(meta[0]))
      .then(function (d) {
        var c = d.current, w = M.describe(c.weather_code);
        badge.textContent = w[0] + ' ' + c.temperature_2m.toFixed(1) + '°';
      })
      .catch(function () { badge.hidden = true; });
  }

  /* ---------- 이벤트 ---------- */
  $('shiftRange').addEventListener('input', function (e) {
    shiftHours = parseFloat(e.target.value);
    var out = $('shiftVal'), reset = $('shiftReset');
    if (shiftHours === 0) {
      out.textContent = '지금';
      out.classList.remove('moved');
      reset.disabled = true;
    } else {
      var sign = shiftHours > 0 ? '+' : '-';
      var abs = Math.abs(shiftHours);
      var h = Math.floor(abs), m = Math.round((abs - h) * 60);
      out.textContent = sign + h + '시간' + (m ? ' ' + m + '분' : '');
      out.classList.add('moved');
      reset.disabled = false;
    }
    tick();
  });

  $('shiftReset').addEventListener('click', function () {
    shiftHours = 0;
    $('shiftRange').value = 0;
    $('shiftRange').dispatchEvent(new Event('input'));
  });

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('addCity'), name = input.value.trim(), err = $('addError');
    err.hidden = true;
    if (!name) return;
    if (!M.CITIES[name]) {
      err.hidden = false;
      err.textContent = '“' + name + '” 은 목록에 없습니다. 입력창의 자동완성에서 골라 주세요.';
      input.focus();
      return;
    }
    if (cities.indexOf(name) !== -1) {
      err.hidden = false;
      err.textContent = '“' + name + '” 은 이미 있습니다.';
      input.focus();
      return;
    }
    cities.push(name);
    M.save('cities', cities);
    input.value = '';
    tick();
  });

  $('rail').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn) return;
    var name = btn.getAttribute('data-remove');
    var wasRef = cities[0] === name;
    cities = cities.filter(function (c) { return c !== name; });
    M.save('cities', cities);
    tick();
    if (wasRef) loadRefWeather();
  });

  $('copyUrl').addEventListener('click', function () {
    var url = location.origin + location.pathname + '?c=' + encodeURIComponent(cities.join(','));
    var btn = this;
    navigator.clipboard.writeText(url).then(function () {
      var old = btn.textContent;
      btn.textContent = '복사했습니다';
      setTimeout(function () { btn.textContent = old; }, 1600);
    }, function () {
      window.prompt('아래 주소를 복사하세요', url);
    });
  });

  $('focusAdd').addEventListener('click', function () { $('addCity').focus(); });

  /* ---------- 시작 ---------- */
  tick();
  loadRefWeather();
  setInterval(tick, 1000);
  setInterval(loadRefWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
