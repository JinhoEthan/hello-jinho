<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Jinho!</title>
<meta name="description" content="기준 도시의 시각을 중심으로 여러 도시의 지금을 나란히 봅니다.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#010102">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meridian.css">
</head>
<body>
<div id="chrome"></div>

<main id="main">
  <div class="wrap">
    <h1 class="sr-only">세계시간</h1>
    <div class="hero">
     <div class="clockbar">

      <section aria-labelledby="refHeading">
        <div id="brand"></div>
        <p class="ref-city" id="refHeading">
          <span id="refName">서울</span> · <span id="refCountry">대한민국</span>
        </p>
        <p class="clock" id="clock" role="timer" aria-live="off">
          <span id="clockHM">--:--</span><span class="sec" id="clockS">--</span>
        </p>
        <div class="hero-meta">
          <span class="date" id="refDate">&nbsp;</span>
        </div>
      </section>

      <section class="shift" aria-labelledby="shiftLabel">
          <div class="shift-head">
            <h2 id="shiftLabel">시간 옮겨 보기</h2>
            <button type="button" class="shift-reset" id="shiftReset" disabled>지금으로 되돌리기</button>
          </div>
          <output class="shift-val" id="shiftVal" for="shiftRange">지금</output>
          <div class="slider">
            <input type="range" id="shiftRange" min="-24" max="24" step="0.5" value="0"
                   aria-labelledby="shiftLabel" aria-describedby="shiftVal">
          </div>
          <div class="slider-ticks" aria-hidden="true">
            <span>-24</span><span>-12</span><span>0</span><span>+12</span><span>+24</span>
          </div>

          <nav class="marks" aria-label="바로가기">
            <div class="marks-row" id="marks"></div>
            <form class="mark-form" id="markForm" hidden>
              <label class="field-label" for="markIcon" hidden>아이콘</label>
              <input class="input i" id="markIcon" placeholder="아이콘" maxlength="2"
                     autocomplete="off" spellcheck="false" aria-describedby="markHint">
              <label class="field-label" for="markName" hidden>이름</label>
              <input class="input n" id="markName" placeholder="이름 (선택)" autocomplete="off" spellcheck="false">
              <label class="field-label" for="markUrl" hidden>주소</label>
              <input class="input u" id="markUrl" type="url" placeholder="예: naver.com" autocomplete="off" spellcheck="false">
              <button type="submit" class="btn btn-primary">저장</button>
              <button type="button" class="btn btn-tertiary" id="markCancel">취소</button>
              <p class="add-hint" id="markHint">아이콘 칸에 이모지를 넣으면 그 그림이 대신 나옵니다. 비우면 사이트 아이콘을 씁니다.</p>
            </form>
            <p class="error" id="markError" role="alert" hidden></p>
          </nav>
      </section>

     </div>

      <section class="panel" aria-labelledby="railHeading" style="margin-top:var(--sp-lg)">
        <h2 class="t-body-sm" id="railHeading" style="margin-bottom:var(--sp-xs)">도시별 현재 시각</h2>
        <div class="rail" id="rail"></div>

        <form class="add-row" id="addForm">
          <label class="field-label" for="addCity" hidden>도시 이름</label>
          <input class="input" id="addCity" name="city" list="cityList" autocomplete="off" spellcheck="false"
                 placeholder="도시 이름을 입력하세요">
          <button type="submit" class="btn btn-primary">추가</button>
        </form>
        <datalist id="cityList"></datalist>
        <p class="error" id="addError" role="alert" hidden></p>
      </section>

    </div>
  </div>
</main>

<div id="pagefoot"></div>

<script src="meridian.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  document.getElementById('chrome').innerHTML = M.nav('세계시간');
  document.getElementById('brand').innerHTML = M.brandMark();
  document.getElementById('pagefoot').innerHTML =
    M.foot('날씨 <a href="https://open-meteo.com/">Open-Meteo</a>');

  $('navActions').innerHTML =
    '<button type="button" class="btn btn-tertiary" id="copyUrl">주소 복사</button>' +
    '<button type="button" class="btn btn-secondary" id="focusAdd">도시 추가</button>';

  /* ---------- 상태 ---------- */
  var params = new URLSearchParams(location.search);
  var fromUrl = params.get('c');
  var cities;
  if (fromUrl) {
    cities = fromUrl.split(',').map(function (s) { return s.trim(); })
                    .filter(function (s) { return M.CITIES[s]; });
    if (cities.length) M.save('cities', cities);
  }
  if (!cities || !cities.length) cities = M.load('cities', M.DEFAULT_CITIES).slice();
  cities = cities.filter(function (c) { return M.CITIES[c]; });
  if (!cities.length) cities = M.DEFAULT_CITIES.slice();

  var shiftHours = 0;

  /* 도시 이름 자동완성 */
  $('cityList').innerHTML = Object.keys(M.CITIES).map(function (n) {
    return '<option value="' + M.escapeHtml(n) + '"></option>';
  }).join('');

  function refCity() { return cities[0]; }
  function shiftedNow() { return new Date(Date.now() + shiftHours * 3600000); }

  /* 도시별 날씨 캐시: { 도시: {temp, code, isDay} } */
  var wx = {};

  /* ---------- 렌더 ----------
     구조를 만드는 buildRail 과 1초마다 도는 updateTimes 를 나눈다.
     매초 innerHTML 을 갈아치우면 도시마다 SVG 아이콘까지 다시 그리게 된다. */
  function weatherCell(city) {
    var w = wx[city];
    if (w === undefined) {
      return '<div class="rail-wx"><div class="line">' +
             '<span class="skeleton">--.-°</span></div></div>';
    }
    if (w === null) return '<div class="rail-wx"></div>';
    var d = M.describe(w.code);
    return '<div class="rail-wx">' +
      '<div class="line">' + M.iconFor(d[1], w.isDay, 18) +
        '<span class="tmp">' + w.temp.toFixed(1) + '°</span></div>' +
      '<div class="cond">' + d[0] + '</div>' +
    '</div>';
  }

  function buildRail() {
    $('rail').innerHTML = cities.map(function (city, idx) {
      var isRef = idx === 0;
      return '<div class="rail-row' + (isRef ? ' is-ref' : '') +
             '" data-city="' + M.escapeHtml(city) + '">' +
        '<div class="rail-head">' +
          '<div>' +
            '<div class="rail-name">' + M.escapeHtml(city) + '</div>' +
            '<div class="rail-off"></div>' +
          '</div>' +
          weatherCell(city) +
          '<div>' +
            '<div class="rail-time">--:--</div>' +
            '<div class="rail-day"></div>' +
          '</div>' +
          (cities.length > 1
            ? '<button type="button" class="rail-remove" data-remove="' + M.escapeHtml(city) +
              '" aria-label="' + M.escapeHtml(city) + ' 삭제">' + M.icon('close', 15) + '</button>'
            : '<span></span>') +
        '</div>' +
        '<div class="band" role="img" aria-label="' + M.escapeHtml(city) + ' 낮과 밤">' +
          new Array(25).join('<i></i>') +
        '</div>' +
        '<div class="band-legend"></div>' +
      '</div>';
    }).join('');
    updateTimes();
  }

  function updateTimes() {
    var now = shiftedNow();
    var refTz = M.CITIES[refCity()][0];
    var refP = M.tzParts(refTz, now);

    Array.prototype.forEach.call($('rail').children, function (row, idx) {
      var city = row.getAttribute('data-city');
      var meta = M.CITIES[city];
      if (!meta) return;
      var p = M.tzParts(meta[0], now);
      var delta = M.dayDelta(refP, p);

      row.querySelector('.rail-off').textContent =
        idx === 0 ? '기준' : M.formatOffset(M.offsetMinutes(refTz, meta[0], now));
      row.querySelector('.rail-time').textContent = M.pad2(p.hour) + ':' + M.pad2(p.minute);
      row.querySelector('.rail-day').textContent =
        delta === 0 ? '오늘' : delta > 0 ? '내일' : '어제';

      var dl = M.daylight(city, now);
      var bars = row.querySelectorAll('.band i');
      for (var h = 0; h < 24; h++) {
        bars[h].className = (h === p.hour) ? 'now' : (dl.hours[h] ? 'day' : '');
      }
      row.querySelector('.band-legend').innerHTML = dl.setLabel
        ? '<span>해 뜸 <span class="mono">' + dl.riseLabel + '</span></span>' +
          '<span>해 짐 <span class="mono">' + dl.setLabel + '</span></span>'
        : (dl.riseLabel ? '<span>' + dl.riseLabel + '</span>' : '');
    });
  }

  function renderHero() {
    var now = shiftedNow();
    var ref = refCity(), meta = M.CITIES[ref];
    var p = M.tzParts(meta[0], now);
    $('refName').textContent = ref;
    $('refCountry').textContent = meta[3];
    $('clockHM').textContent = M.pad2(p.hour) + ':' + M.pad2(p.minute);
    $('clockS').textContent = M.pad2(p.second);
    $('clock').setAttribute('aria-label',
      ref + ' ' + p.hour + '시 ' + p.minute + '분');
    $('refDate').textContent = M.formatDate(meta[0], now);
  }

  function tick() {
    renderHero();
    updateTimes();
  }

  /* ---------- 날씨: 모든 도시를 한 번에 ---------- */
  function loadWeather() {
    if (!cities.length) return;
    var lats = cities.map(function (c) { return M.CITIES[c][1]; }).join(',');
    var lons = cities.map(function (c) { return M.CITIES[c][2]; }).join(',');

    M.getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + lats +
      '&longitude=' + lons + '&current=temperature_2m,weather_code,is_day&timezone=auto')
      .then(function (data) {
        var list = Array.isArray(data) ? data : [data];
        cities.forEach(function (city, i) {
          var d = list[i];
          if (!d || !d.current) { wx[city] = null; return; }
          wx[city] = {
            temp: d.current.temperature_2m,
            code: d.current.weather_code,
            isDay: d.current.is_day === 1
          };
        });
        buildRail();
      })
      .catch(function () {
        cities.forEach(function (c) { if (wx[c] === undefined) wx[c] = null; });
        buildRail();
      });
  }

  /* ---------- 바로가기 ---------- */
  var marks = M.load('bookmarks', M.DEFAULT_BOOKMARKS).filter(function (b) {
    return b && b.url;
  });

  function renderMarks() {
    $('marks').innerHTML = marks.map(function (b, i) {
      var label = b.name || M.hostOf(b.url);
      var glyph = b.icon
        ? '<span class="emoji" aria-hidden="true">' + M.escapeHtml(b.icon) + '</span>'
        : '<img src="' + M.escapeHtml(M.faviconUrl(b.url)) + '" alt="" ' +
          'width="14" height="14" loading="lazy" data-letter="' +
          M.escapeHtml(label.slice(0, 1)) + '">';
      return '<span class="mark-item">' +
        /* 시작 페이지는 그대로 두고 새 탭에서 연다.
           noopener 가 없으면 열린 쪽에서 window.opener 로 이 페이지를 건드릴 수 있다. */
        '<a href="' + M.escapeHtml(b.url) + '" target="_blank" rel="noopener noreferrer"' +
          ' title="' + M.escapeHtml(label) + '"' +
          ' aria-label="' + M.escapeHtml(label) + ' (새 탭에서 열기)">' +
          glyph + '<span class="label">' + M.escapeHtml(label) + '</span>' +
        '</a>' +
        '<span class="mark-tools">' +
          '<button type="button" data-edit="' + i + '" aria-label="' +
            M.escapeHtml(label) + ' 바로가기 편집">' + M.icon('pencil', 11) + '</button>' +
          '<button type="button" data-mark="' + i + '" aria-label="' +
            M.escapeHtml(label) + ' 바로가기 삭제">' + M.icon('close', 11) + '</button>' +
        '</span>' +
      '</span>';
    }).join('') +
    '<button type="button" class="mark-add" id="markAdd" aria-label="바로가기 추가" ' +
      'title="바로가기 추가">' + M.icon('plus', 15) + '</button>';

    /* 파비콘을 못 받아오면 첫 글자로 바꾼다 */
    Array.prototype.forEach.call($('marks').querySelectorAll('img'), function (img) {
      img.addEventListener('error', function () {
        var s = document.createElement('span');
        s.className = 'letter';
        s.textContent = img.getAttribute('data-letter') || '?';
        s.setAttribute('aria-hidden', 'true');
        if (img.parentNode) img.parentNode.replaceChild(s, img);
      });
    });
    fitLabels();
  }

  /* 이름이 칸을 넘으면 12px 에서 9px 까지 0.5px 씩 줄여 맞춘다 */
  function fitLabels() {
    Array.prototype.forEach.call($('marks').querySelectorAll('.label'), function (el) {
      var size = 12;
      el.style.fontSize = size + 'px';
      while (el.scrollWidth > el.clientWidth && size > 9) {
        size -= 0.5;
        el.style.fontSize = size + 'px';
      }
    });
  }

  /* 웹폰트가 늦게 오면 폭이 달라지므로 한 번 더 맞춘다 */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitLabels);
  }

  var editing = -1;   /* 편집 중인 바로가기 번호, -1 이면 새로 추가 */

  function openMarkForm(index) {
    editing = (typeof index === 'number') ? index : -1;
    var b = editing >= 0 ? marks[editing] : { icon: '', name: '', url: '' };
    $('markIcon').value = b.icon || '';
    $('markName').value = b.name || '';
    $('markUrl').value = b.url || '';
    $('markForm').hidden = false;
    $('markError').hidden = true;
    (editing >= 0 ? $('markIcon') : $('markUrl')).focus();
  }

  function closeMarkForm() {
    editing = -1;
    $('markForm').hidden = true;
    $('markError').hidden = true;
  }

  $('marks').addEventListener('click', function (e) {
    if (e.target.closest('#markAdd')) { openMarkForm(); return; }

    var edit = e.target.closest('[data-edit]');
    if (edit) { openMarkForm(parseInt(edit.getAttribute('data-edit'), 10)); return; }

    var del = e.target.closest('[data-mark]');
    if (!del) return;
    marks.splice(parseInt(del.getAttribute('data-mark'), 10), 1);
    M.save('bookmarks', marks);
    closeMarkForm();
    renderMarks();
  });

  $('markForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('markError');
    var url = M.normalizeUrl($('markUrl').value);
    if (!url) {
      err.hidden = false;
      err.textContent = '주소를 확인해 주세요. naver.com 처럼 입력하시면 됩니다.';
      $('markUrl').focus();
      return;
    }
    var entry = {
      icon: $('markIcon').value.trim(),
      name: $('markName').value.trim(),
      url: url
    };
    if (editing >= 0) marks[editing] = entry; else marks.push(entry);
    M.save('bookmarks', marks);
    closeMarkForm();
    renderMarks();
  });

  $('markCancel').addEventListener('click', closeMarkForm);

  /* ---------- 이벤트 ---------- */
  $('shiftRange').addEventListener('input', function (e) {
    shiftHours = parseFloat(e.target.value);
    var out = $('shiftVal'), reset = $('shiftReset');
    if (shiftHours === 0) {
      out.textContent = '지금';
      out.classList.remove('moved');
      reset.disabled = true;
    } else {
      var sign = shiftHours > 0 ? '+' : '-';
      var abs = Math.abs(shiftHours);
      var h = Math.floor(abs), m = Math.round((abs - h) * 60);
      out.textContent = sign + h + '시간' + (m ? ' ' + m + '분' : '');
      out.classList.add('moved');
      reset.disabled = false;
    }
    tick();
  });

  $('shiftReset').addEventListener('click', function () {
    shiftHours = 0;
    $('shiftRange').value = 0;
    $('shiftRange').dispatchEvent(new Event('input'));
  });

  $('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('addCity'), name = input.value.trim(), err = $('addError');
    err.hidden = true;
    if (!name) return;
    if (!M.CITIES[name]) {
      err.hidden = false;
      err.textContent = '“' + name + '” 은 목록에 없습니다. 입력창의 자동완성에서 골라 주세요.';
      input.focus();
      return;
    }
    if (cities.indexOf(name) !== -1) {
      err.hidden = false;
      err.textContent = '“' + name + '” 은 이미 있습니다.';
      input.focus();
      return;
    }
    cities.push(name);
    M.save('cities', cities);
    input.value = '';
    buildRail();          // 새 도시는 날씨가 올 때까지 자리만 잡아 둔다
    renderHero();
    loadWeather();
  });

  $('rail').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn) return;
    var name = btn.getAttribute('data-remove');
    var wasRef = cities[0] === name;
    cities = cities.filter(function (c) { return c !== name; });
    delete wx[name];
    M.save('cities', cities);
    buildRail();
    renderHero();
    if (wasRef) loadWeather();
  });

  $('copyUrl').addEventListener('click', function () {
    var url = location.origin + location.pathname + '?c=' + encodeURIComponent(cities.join(','));
    var btn = this;
    navigator.clipboard.writeText(url).then(function () {
      var old = btn.textContent;
      btn.textContent = '복사했습니다';
      setTimeout(function () { btn.textContent = old; }, 1600);
    }, function () {
      window.prompt('아래 주소를 복사하세요', url);
    });
  });

  $('focusAdd').addEventListener('click', function () { $('addCity').focus(); });

  /* ---------- 시작 ---------- */
  renderMarks();
  buildRail();
  renderHero();
  loadWeather();
  setInterval(tick, 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
